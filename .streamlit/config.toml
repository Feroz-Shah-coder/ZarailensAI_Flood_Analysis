[theme]
base = "light"
primaryColor = "#1f6b45"
backgroundColor = "#f4f7f5"
secondaryBackgroundColor = "#e9f0ec"
textColor = "#17241e"
borderColor = "#d5e2da"
baseRadius = "medium"
greenColor = "#1f8a4c"
redColor = "#c62828"
orangeColor = "#e8711a"
yellowColor = "#d9a400"
blueColor = "#2f7de1"
violetColor = "#6b4fc4"
chartCategoricalColors = ["#f2c12e", "#2e9e5b", "#2f7de1", "#b7a3e6", "#e8711a", "#9e9e9e"]

[theme.sidebar]
backgroundColor = "#0f3d2e"
secondaryBackgroundColor = "#17533f"
textColor = "#e8f3ec"
primaryColor = "#3fae6a"
borderColor = "#1d5a45"

[server]
# headless stays false so `streamlit run app.py` opens the browser automatically.
# The Dockerfile passes --server.headless=true for servers.
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
