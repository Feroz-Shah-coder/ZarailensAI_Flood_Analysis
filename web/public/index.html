<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZarailensAI – Agricultural Flood Impact Assessment</title>
<meta name="description" content="ZarailensAI: satellite flood monitoring and crop damage risk for Khyber Pakhtunkhwa, using real Google Earth Engine data (Sentinel-1, Sentinel-2, Landsat).">
<meta name="theme-color" content="#0f3d2e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
  :root{--green:#0f3d2e;--green2:#17533f;--accent:#3fae6a;--bg:#f4f7f5;--text:#17241e}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  body{display:flex;flex-direction:column;min-height:100dvh}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  a.btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;
    color:#fff;background:var(--green);text-decoration:none;border-radius:999px;padding:.5rem .95rem;font-size:.85rem;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.25)}
  a.btn:hover{background:var(--green2)}
  main{flex:1;position:relative;display:flex}
  iframe{flex:1;width:100%;border:0;min-height:100dvh;background:var(--bg)}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.8rem;text-align:center;padding:1.5rem;background:var(--bg);transition:opacity .4s}
  .overlay.hide{opacity:0;pointer-events:none}
  .spin{width:42px;height:42px;border-radius:50%;border:4px solid #d5e2da;border-top-color:var(--accent);animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .card{max-width:640px;background:#fff;border:1px solid #d5e2da;border-radius:14px;padding:1.3rem 1.5rem;line-height:1.55}
  code{background:#eef1ef;border-radius:5px;padding:.1rem .35rem}
  .muted{color:#5b6a63;font-size:.9rem}
</style>
</head>
<body>
<h1 class="sr">ZarailensAI – Agricultural Flood Impact Assessment, Khyber Pakhtunkhwa</h1>
<a class="btn" id="open" href="#" target="_blank" rel="noopener" hidden>Open full app ↗</a>
<main>
  <div class="overlay" id="overlay">
    <div class="spin"></div>
    <div><b>Starting the ZarailensAI analysis server…</b></div>
    <div class="muted">A sleeping free server can take up to a minute to wake up. Satellite data comes live from Google Earth Engine.</div>
  </div>
</main>
<script src="/config.js"></script>
<script>
(function(){
  var url=window.ZARAILENS_APP_URL||"", main=document.querySelector("main"), overlay=document.getElementById("overlay");
  if(!url){
    overlay.innerHTML='<div class="card"><h2 style="margin-top:0">Almost there</h2>'+
      '<p>This Vercel site shows the ZarailensAI app, which runs on a Python host (Render or Streamlit Community Cloud).</p>'+
      '<p>Set the environment variable <code>ZARAILENS_APP_URL</code> in Vercel → Project → Settings → Environment Variables '+
      'to the app address (for example <code>https://zarailensai-app.onrender.com</code>) and redeploy.</p>'+
      '<p class="muted">See DEPLOYMENT.md in the repository.</p></div>';
    return;
  }
  var open=document.getElementById("open"); open.href=url; open.hidden=false;
  var frame=document.createElement("iframe");
  frame.title="ZarailensAI app"; frame.src=url+"/";
  frame.allow="clipboard-write; fullscreen"; frame.referrerPolicy="strict-origin-when-cross-origin";
  frame.addEventListener("load",function(){overlay.classList.add("hide");});
  main.insertBefore(frame,overlay);
  setTimeout(function(){overlay.classList.add("hide");},90000);
})();
</script>
</body>
</html>
