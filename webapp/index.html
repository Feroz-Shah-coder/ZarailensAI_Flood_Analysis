<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZarailensAI – Agricultural Flood Impact Assessment</title>
<meta name="description" content="ZarailensAI: Sentinel-1/2 and Landsat flood monitoring and crop damage risk for Khyber Pakhtunkhwa, computed live with Google Earth Engine.">
<meta name="theme-color" content="#0f3d2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌱%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/assets/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js"></script>
</head>
<body>
<aside id="sidebar" aria-label="Navigation">
  <div class="side-brand">🌱💧 <b>ZarailensAI</b></div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <div id="ee-status" class="muted-light">Earth Engine: checking…</div>
    <div id="token-box" hidden>
      <label for="token">Analyst token</label>
      <input id="token" type="password" autocomplete="off" placeholder="needed to run analyses">
    </div>
  </div>
</aside>
<div id="scrim" hidden></div>
<div id="main">
  <header class="topbar">
    <button id="menu" aria-label="Open menu">☰</button>
    <div class="brand"><div class="logo">🌱💧</div>
      <div><p class="title">ZarailensAI</p><p class="sub">Agricultural Flood Impact Assessment</p></div></div>
    <div class="badge">FYP – Khyber Pakhtunkhwa (KPK)</div>
  </header>
  <main id="page" tabindex="-1"></main>
  <footer class="foot">Satellite-derived indicators require ground validation. Flooded farmland does not automatically mean destroyed crops;
    no crop-loss percentage or financial loss is estimated.</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
