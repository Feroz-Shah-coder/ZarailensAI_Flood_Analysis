[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zarailens-ai"
version = "0.1.0"
description = "Dynamic Satellite-Based Agricultural Flood Detection and Impact Assessment for KPK"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi==0.118.0", "uvicorn==0.37.0", "earthengine-api==1.6.15", "google-api-python-client==1.12.11", "numpy==2.2.6", "shapely==2.1.2", "requests==2.32.5", "reportlab==4.4.4", "openpyxl==3.1.5", "python-dotenv==1.2.1", "pydantic==2.12.5", "pydantic-settings==2.12.0"]

[tool.setuptools.packages.find]
include = ["src*", "config*", "server*"]
