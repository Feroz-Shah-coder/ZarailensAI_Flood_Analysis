[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zarailens-ai"
version = "0.1.0"
description = "Dynamic Satellite-Based Agricultural Flood Detection and Impact Assessment for KPK"
requires-python = ">=3.11,<3.13"
dependencies = ["streamlit==1.57.0", "starlette==1.4.1", "earthengine-api==1.6.15", "numpy==2.2.6", "pydantic==2.12.5", "pydantic-settings==2.12.0"]

[tool.setuptools.packages.find]
include = ["src*", "config*"]
